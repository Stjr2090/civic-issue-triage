<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Civic Issue Triage — Report an Issue</title>
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --border: #334155;
    --text: #e2e8f0; --muted: #94a3b8; --accent: #38bdf8; --ok: #4ade80; --err: #f87171;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh;
    padding: 24px 16px;
  }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 28px; width: 100%; max-width: 480px; margin: 0 auto;
  }
  .logo-header { display: flex; align-items: center; justify-content: center; margin: 0 0 22px; }
  .logo-header img { height: 64px; width: auto; display: block; }
  h1 { font-size: 1.3rem; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: .9rem; margin-bottom: 20px; }
  label { display: block; font-size: .85rem; color: var(--muted); margin: 14px 0 6px; }
  input, textarea, select {
    width: 100%; padding: 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    font-size: 1rem;
  }
  textarea { min-height: 90px; resize: vertical; }
  button {
    margin-top: 20px; width: 100%; padding: 12px; border: 0; border-radius: 8px;
    background: var(--accent); color: #0f172a; font-weight: 700; font-size: 1rem;
    cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: wait; }
  .msg { margin-top: 14px; padding: 10px; border-radius: 8px; font-size: .9rem; display: none; }
  .msg.ok { display: block; background: rgba(74,222,128,.12); color: var(--ok); }
  .msg.err { display: block; background: rgba(248,113,113,.12); color: var(--err); }
  .nav { margin-top: 18px; text-align: center; }
  .nav a { color: var(--accent); font-size: .85rem; text-decoration: none; }
  .charcount { font-size: .75rem; color: var(--muted); text-align: right; margin-top: 4px; }
</style>
</head>
<body>
<header class="logo-header">
  <img src="/static/reporta-logo-cropped.svg" alt="Reporta logo"
       onerror="this.remove()">
</header>
<main class="card">
  <h1>Report a Civic Issue</h1>
  <p class="sub">Potholes, water outages, waste, public services — submit it and it gets routed.</p>
  <form id="report-form">
    <label for="title">Title</label>
    <input id="title" name="title" required minlength="3" maxlength="200"
           placeholder="Pothole on Main Rd">

    <label for="description">Description</label>
    <textarea id="description" name="description" required minlength="10" maxlength="4000"
              placeholder="What's wrong, where exactly, and how bad is it? (min 10 chars)"></textarea>
    <div class="charcount"><span id="count">0</span>/4000</div>

    <label for="category">Category</label>
    <select id="category" name="category" required>
      <option value="roads">Roads</option>
      <option value="water">Water</option>
      <option value="waste">Waste</option>
      <option value="public_services">Public services</option>
    </select>

    <label for="reporter">Your name (optional)</label>
    <input id="reporter" name="reporter" maxlength="120" placeholder="Anonymous">

    <label for="location">Location (optional)</label>
    <input id="location" name="location" maxlength="200" placeholder="Area, street, landmark">

    <button type="submit" id="submit-btn">Submit report</button>
    <div class="msg" id="msg" role="alert"></div>
  </form>
  <nav class="nav"><a href="/dashboard">View the dashboard &rarr;</a></nav>
</main>

<script>
(function () {
  var form = document.getElementById("report-form");
  var btn = document.getElementById("submit-btn");
  var msg = document.getElementById("msg");
  var desc = document.getElementById("description");
  var count = document.getElementById("count");

  desc.addEventListener("input", function () { count.textContent = desc.value.length; });

  function show(kind, text) {
    msg.className = "msg " + kind;
    msg.textContent = text;
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    btn.disabled = true;
    show("", "");

    var payload = {
      title: document.getElementById("title").value.trim(),
      description: desc.value.trim(),
      category: document.getElementById("category").value,
      reporter: document.getElementById("reporter").value.trim() || null,
      location: document.getElementById("location").value.trim() || null,
      source: "web"
    };

    fetch("/api/reports", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    })
    .then(function (res) {
      return res.json().then(function (body) { return { ok: res.ok, body: body }; });
    })
    .then(function (r) {
      if (r.ok) {
        show("ok", "Thank you, your report has been received and filed as #" + r.body.id + ".");
        form.reset();
        count.textContent = "0";
      } else {
        show("err", r.body.detail || "Submission failed.");
      }
    })
    .catch(function () { show("err", "Network error — try again."); })
    .finally(function () { btn.disabled = false; });
  });
})();
</script>
</body>
</html>
