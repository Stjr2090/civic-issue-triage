<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Civic Issue Triage — Dashboard</title>
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --border: #334155;
    --text: #e2e8f0; --muted: #94a3b8; --accent: #38bdf8;
    --u1: #4ade80; --u2: #a3e635; --u3: #fbbf24; --u4: #fb923c; --u5: #f87171;
    --err: #f87171;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--text); padding: 24px 16px;
  }
  .wrap { max-width: 960px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .logo-header img { height: 44px; width: auto; display: block; }
  header a { color: var(--accent); font-size: .85rem; text-decoration: none; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
  .stat .n { font-size: 1.6rem; font-weight: 700; }
  .stat .l { font-size: .75rem; color: var(--muted); margin-top: 2px; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .filters select, .filters button {
    padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); font-size: .85rem;
  }
  .filters button { cursor: pointer; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 12px; font-size: .85rem; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; }
  tr:last-child td { border-bottom: 0; }
  .urgent { border-left: 3px solid var(--u5); }
  .row-needs-review { background: rgba(248,113,113,.06); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: .72rem; font-weight: 700; }
  .st-new { background: rgba(56,189,248,.15); color: var(--accent); }
  .st-routed { background: rgba(163,230,53,.15); color: var(--u2); }
  .st-in_progress { background: rgba(251,191,36,.15); color: var(--u3); }
  .st-resolved, .st-closed { background: rgba(74,222,128,.15); color: var(--u1); }
  .rev { background: rgba(248,113,113,.15); color: var(--err); }
  .urg { font-weight: 700; }
  .u1 { color: var(--u1); } .u2 { color: var(--u2); } .u3 { color: var(--u3); }
  .u4 { color: var(--u4); } .u5 { color: var(--u5); }
  .empty { color: var(--muted); text-align: center; padding: 24px; font-size: .9rem; }
  .is-hidden { display: none !important; }
  .auth-prompt { border: 1px solid var(--u1); border-radius: 10px; padding: 6px; }
  .rowbtn { padding: 4px 10px; font-size: .75rem; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--accent); cursor: pointer; }
  .rowbtn:hover { background: rgba(56,189,248,.1); }
  td.desc { color: var(--muted); max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: rgba(56,189,248,.05); }
  .detail-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; justify-content: flex-end; z-index: 50; }
  .detail-backdrop[hidden] { display: none; }
  .detail-panel { position: relative; width: min(540px, 100%); height: 100%; overflow-y: auto; background: var(--card); border-left: 1px solid var(--border); padding: 20px; }
  .detail-close { position: absolute; top: 8px; right: 12px; background: transparent; border: 0; color: var(--muted); font-size: 1.7rem; line-height: 1; cursor: pointer; }
  .detail-close:hover { color: var(--text); }
  .detail h2 { font-size: 1.05rem; margin: 4px 0 10px; padding-right: 28px; }
  .detail h3 { font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 0 6px; }
  .detail .kv { font-size: .82rem; display: flex; gap: 8px; margin: 3px 0; }
  .detail .kv b { color: var(--muted); font-weight: 600; min-width: 96px; }
  .detail .state { color: var(--muted); font-style: italic; font-size: .82rem; }
  .detail p.body { font-size: .85rem; color: var(--muted); margin: 10px 0; }
  .detail ul { list-style: none; margin: 0; padding: 0; font-size: .82rem; }
  .detail li { padding: 6px 0; border-bottom: 1px solid var(--border); }
  .detail li:last-child { border-bottom: 0; }
  .detail .act { color: var(--accent); font-weight: 600; }
  .detail .routebtn { margin-top: 16px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--accent); background: rgba(56,189,248,.12); color: var(--accent); cursor: pointer; font-size: .85rem; }
  .detail .routebtn[disabled] { opacity: .45; cursor: not-allowed; }
  @media (max-width: 640px) { .stats { grid-template-columns: repeat(2, 1fr); } td.desc { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="logo-header">
      <img src="/static/reporta-logo-cropped.svg" alt="Reporta logo"
           onerror="this.remove()">
    </span>
    <span id="auth-box" style="display:flex;gap:8px;align-items:center;font-size:.85rem;">
      <input id="auth-user" placeholder="admin user" autocomplete="username"
        style="padding:6px 8px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);width:9rem;">
      <input id="auth-pass" type="password" placeholder="password" autocomplete="current-password"
        style="padding:6px 8px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);width:9rem;">
      <button id="auth-btn" style="padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;">Sign in</button>
      <span id="auth-state" style="color:var(--muted);"></span>
    </span>
    <a href="/">&larr; Submit a report</a>
  </header>

  <section class="stats" id="stats"></section>

  <section class="filters">
    <select id="f-category">
      <option value="">All categories</option>
      <option value="roads">Roads</option>
      <option value="water">Water</option>
      <option value="waste">Waste</option>
      <option value="public_services">Public services</option>
    </select>
    <select id="f-status">
      <option value="">All statuses</option>
      <option value="new">New</option>
      <option value="routed">Routed</option>
      <option value="in_progress">In progress</option>
      <option value="resolved">Resolved</option>
      <option value="closed">Closed</option>
    </select>
    <select id="f-source">
      <option value="">All sources</option>
      <option value="web">Web</option>
      <option value="telegram">Telegram</option>
      <option value="api">API</option>
    </select>
    <select id="f-review">
      <option value="">All reports</option>
      <option value="1">Needs review</option>
      <option value="0">No review needed</option>
    </select>
    <button id="reload">Refresh</button>
  </section>

  <table id="report-list">
    <thead>
      <tr>
        <th>ID</th><th>Title</th><th class="desc-col">Description</th><th>Category</th>
        <th>Urgency</th><th>Status</th><th>Source</th><th></th>
      </tr>
    </thead>
    <tbody id="rows"><tr><td colspan="8" class="empty">Loading…</td></tr></tbody>
  </table>
  <p id="auth-hint" class="is-hidden" style="color:var(--muted);font-size:.9rem;margin-top:12px;">Admin sign-in required — public report form stays at /</p>
</div>

<div class="detail-backdrop" id="detail-backdrop" hidden>
  <div class="detail-panel" role="dialog" aria-modal="true" aria-label="Report detail">
    <button class="detail-close" id="detail-close" aria-label="Close detail">&times;</button>
    <div class="detail" id="detail-body"></div>
  </div>
</div>

<script>
(function () {
  var CATS = { roads: "Roads", water: "Water", waste: "Waste", public_services: "Public services", other: "Other" };
  var el = function (id) { return document.getElementById(id); };

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function handle401() {
    el("stats").classList.add("is-hidden");
    el("report-list").classList.add("is-hidden");
    el("auth-hint").classList.remove("is-hidden");
    el("auth-box").classList.add("auth-prompt");
    var state = el("auth-state");
    state.textContent = "session expired — sign in";
    state.style.color = "var(--u1)";
    closeDetail();
    el("auth-user").focus();
  }

  function loadStats() {
    fetch("/api/stats").then(function (r) {
      if (r.status === 401) { handle401(); return null; }
      if (!r.ok) return null;
      return r.json();
    }).then(function (s) {
      if (!s) return;
      var items = [
        { n: s.total, l: "Total reports" },
        { n: s.by_status.new || 0, l: "New" },
        { n: s.by_status.routed || 0, l: "Routed" },
        { n: s.by_status.in_progress || 0, l: "In progress" },
        { n: s.urgent_open, l: "Urgent open (urg ≥ 4)" }
      ];
      el("stats").innerHTML = items.map(function (i) {
        return '<div class="stat"><div class="n">' + i.n + '</div><div class="l">' + i.l + "</div></div>";
      }).join("");
    });
  }

  function loadRows() {
    var p = new URLSearchParams();
    var cat = el("f-category").value, st = el("f-status").value,
        src = el("f-source").value, rev = el("f-review").value;
    if (cat) p.set("category", cat);
    if (st) p.set("status", st);
    if (src) p.set("source", src);
    if (rev !== "") p.set("needs_review", rev);

    fetch("/api/reports?" + p.toString()).then(function (r) {
      if (r.status === 401) { handle401(); return null; }
      if (!r.ok) return null;
      return r.json();
    }).then(function (rows) {
      if (!rows) return;
      if (!rows.length) {
        el("rows").innerHTML = '<tr><td colspan="8" class="empty">No reports match these filters.</td></tr>';
        return;
      }
      el("rows").innerHTML = rows.map(function (r) {
        var urgCls = "u" + Math.min(r.urgency, 5);
        var isUrgent = r.urgency >= 4 && r.status !== "resolved" && r.status !== "closed";
        var rowCls = ["clickable"];
        if (isUrgent) rowCls.push("urgent");
        if (r.needs_review) rowCls.push("row-needs-review");
        return '<tr class="' + rowCls.join(" ") + '" data-id="' + r.id + '">' +
          "<td>" + r.id + "</td>" +
          "<td>" + esc(r.title) + (r.needs_review ? ' <span class="badge rev">review</span>' : "") + "</td>" +
          '<td class="desc">' + esc((r.description || "").slice(0, 80)) + "</td>" +
          "<td>" + (CATS[r.category] || esc(r.category)) + "</td>" +
          '<td class="urg ' + urgCls + '">' + r.urgency + "/5</td>" +
          '<td><span class="badge st-' + esc(r.status) + '">' + esc(r.status).replace("_", " ") + "</span></td>" +
          "<td>" + esc(r.source) + "</td>" +
          "<td>" + (r.status === "new" ? '<button class="rowbtn" data-id="' + r.id + '">Route</button>' : "") + "</td>" +
          "</tr>";
      }).join("");
    });
  }

  var backdrop = el("detail-backdrop");
  var detailBody = el("detail-body");

  function closeDetail() {
    backdrop.hidden = true;
    detailBody.innerHTML = "";
  }

  function openDetail(id) {
    detailBody.innerHTML = '<p class="state">Loading…</p>';
    backdrop.hidden = false;
    fetch("/api/reports/" + id + "/detail").then(function (r) {
      if (r.status === 401) { handle401(); return null; }
      if (!r.ok) throw new Error("detail " + r.status);
      return r.json();
    }).then(function (d) {
      if (d) renderDetail(d);
    }).catch(function () {
      detailBody.innerHTML = '<p class="state">Could not load this report.</p>';
      backdrop.hidden = false;
    });
  }

  function renderDetail(d) {
    var rep = d.report, an = d.analysis, hist = d.routing_history,
        opts = d.next_options, atts = d.attachments;
    var h = [];
    h.push("<h2>#" + rep.id + " " + esc(rep.title) + "</h2>");
    h.push('<div class="kv"><b>Status</b><span>' + esc(rep.status) + "</span></div>");
    h.push('<div class="kv"><b>Category</b><span>' + (CATS[rep.category] || esc(rep.category)) + "</span></div>");
    h.push('<div class="kv"><b>Source</b><span>' + esc(rep.source) + "</span></div>");
    h.push('<div class="kv"><b>Reporter</b><span>' + esc(rep.reporter || "—") + "</span></div>");
    h.push('<div class="kv"><b>Location</b><span>' + esc(rep.location || "—") + "</span></div>");
    h.push('<p class="body">' + esc(rep.description) + "</p>");

    h.push("<h3>Analysis</h3>");
    if (an.state === "not classified (pre-T4 report)") {
      h.push('<div class="state">not classified (pre-T4 report)</div>');
    } else {
      h.push('<div class="kv"><b>State</b><span>classified</span></div>');
      h.push('<div class="kv"><b>Confidence</b><span>' + esc(an.confidence) + "</span></div>");
      h.push('<div class="kv"><b>Urgency</b><span>' + esc(an.urgency) + "/5</span></div>");
      h.push('<div class="kv"><b>Needs review</b><span>' + (an.needs_review ? "yes" : "no") + "</span></div>");
      h.push('<div class="kv"><b>Reason</b><span>' + esc(an.reason) + "</span></div>");
    }

    h.push("<h3>Attachments</h3>");
    if (!atts.length) {
      h.push('<div class="state">no attachment</div>');
    } else {
      h.push("<ul>" + atts.map(function (a) {
        return '<li><span class="act">' + esc(a.media_type) + "</span> " + esc(a.file_ref) +
          ' <span class="state">' + esc(a.created_at) + "</span></li>";
      }).join("") + "</ul>");
    }

    h.push("<h3>Routing history</h3>");
    if (!hist.length) {
      h.push('<div class="state">no routing history yet</div>');
    } else {
      h.push("<ul>" + hist.map(function (ev) {
        var txt;
        if (ev.action === "classified" && ev.detail && typeof ev.detail === "object") {
          txt = esc(ev.detail.suggested_category || ev.detail.mode || JSON.stringify(ev.detail));
        } else {
          txt = esc(ev.detail);
        }
        return '<li><span class="act">' + esc(ev.action) + "</span> " + txt +
          ' <span class="state">' + esc(ev.created_at) + "</span></li>";
      }).join("") + "</ul>");
    }

    h.push("<h3>Next routing options</h3>");
    if (!opts.length) {
      h.push('<div class="state">no active authority for category</div>');
    } else {
      h.push("<ul>" + opts.map(function (o) {
        return "<li>" + esc(o.name) +
          ' <span class="state">priority ' + esc(o.priority) + "</span></li>";
      }).join("") + "</ul>");
    }

    var canRoute = rep.status === "new" && opts.length > 0;
    h.push('<button class="routebtn" id="detail-route" data-id="' + rep.id + '"' +
      (canRoute ? "" : " disabled") + ">Route to authority</button>");
    detailBody.innerHTML = h.join("");

    var rbtn = el("detail-route");
    if (rbtn && canRoute) {
      rbtn.addEventListener("click", function () {
        rbtn.disabled = true;
        fetch("/api/route/" + rbtn.dataset.id, { method: "GET" })
          .then(function (r) {
            if (r.status === 401) { handle401(); return null; }
            if (!r.ok) return null;
            return r.json();
          })
          .then(function (b) {
            if (!b) return;
            loadRows(); loadStats(); openDetail(rep.id);
          });
      });
    }
  }

  el("detail-close").addEventListener("click", closeDetail);
  backdrop.addEventListener("click", function (e) { if (e.target === backdrop) closeDetail(); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !backdrop.hidden) closeDetail();
  });

  el("rows").addEventListener("click", function (e) {
    var btn = e.target.closest(".rowbtn");
    if (btn) {
      e.stopPropagation();
      btn.disabled = true;
      fetch("/api/route/" + btn.dataset.id, { method: "GET" })
        .then(function (r) {
          if (r.status === 401) { handle401(); return null; }
          if (!r.ok) return null;
          return r.json();
        })
        .then(function (b) {
          if (!b) return;
          loadRows(); loadStats();
        });
      return;
    }
    var tr = e.target.closest("tr[data-id]");
    if (tr) openDetail(tr.dataset.id);
  });

  ["f-category", "f-status", "f-source", "f-review"].forEach(function (id) {
    el(id).addEventListener("change", loadRows);
  });
  el("reload").addEventListener("click", function () { loadRows(); loadStats(); });

  // Admin sign-in: session cookie unlocks detail view + route buttons.
  var authBtn = el("auth-btn");
  authBtn.addEventListener("click", function () {
    fetch("/api/admin/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify({
        username: el("auth-user").value,
        password: el("auth-pass").value,
      }),
    }).then(function (r) {
      if (r.ok) {
        location.reload();
      } else if (r.status === 503) {
        el("auth-state").textContent = "admin auth not configured";
        el("auth-state").style.color = "var(--err)";
      } else {
        el("auth-state").textContent = "invalid credentials";
        el("auth-state").style.color = "var(--err)";
      }
    }).catch(function () {
      el("auth-state").textContent = "sign-in failed";
      el("auth-state").style.color = "var(--err)";
    });
  });
  el("auth-pass").addEventListener("keydown", function (e) {
    if (e.key === "Enter") authBtn.click();
  });

  loadStats();
  loadRows();
})();
</script>
</body>
</html>
