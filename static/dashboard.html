<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1120">
<title>Civic Issue Triage — Dashboard</title>
<link rel="icon" href="/static/reporta-logo-cropped.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/theme.css">
<script src="/static/theme.js"></script>
<style>
  body { padding: 0 16px 40px; }
  .wrap { max-width: 1100px; margin: 0 auto; }

  header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; padding: 18px 0 22px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand img { height: 32px; width: auto; display: block; }
  .brand .sep { width: 1px; height: 24px; background: var(--border-strong); }
  h1 { font-size: 1.15rem; font-weight: 700; letter-spacing: -.01em; }
  .head-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  /* admin sign-in */
  #auth-box { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .85rem; padding: 6px; border: 1px solid transparent; border-radius: 12px; }
  #auth-box input { padding: 8px 10px; width: 8.5rem; font-size: .85rem; }
  #auth-btn { padding: 8px 14px; border-radius: 8px; border: 0; background: var(--accent); color: var(--on-accent); font: inherit; font-size: .85rem; font-weight: 700; cursor: pointer; }
  #auth-btn:hover { filter: brightness(1.08); }
  #auth-state { color: var(--muted); font-size: .8rem; }
  #auth-out { display: none; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--border-strong); background: transparent; color: var(--text); font: inherit; font-size: .82rem; font-weight: 600; cursor: pointer; }
  #auth-out:hover { border-color: var(--accent); }
  #auth-box.signed-in input, #auth-box.signed-in #auth-btn { display: none; }
  #auth-box.signed-in #auth-out { display: inline-block; }
  #auth-box.signed-in #auth-state::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--u1); margin-right: 8px; box-shadow: 0 0 8px var(--u1); }
  .auth-prompt { border-color: color-mix(in srgb, var(--accent) 50%, transparent) !important; background: color-mix(in srgb, var(--accent) 7%, transparent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 9%, transparent); }

  /* stats */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 22px; }
  .stat { position: relative; overflow: hidden; background: linear-gradient(180deg, var(--card-2), var(--card)); border: 1px solid var(--border); border-radius: 14px; padding: 16px 16px 14px; }
  .stat::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--c, var(--accent)); }
  .stat .n { font-size: 1.9rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: .76rem; color: var(--muted); margin-top: 4px; font-weight: 500; }
  .stat.urgent .n { color: var(--u5); }

  /* toolbar */
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
  .toolbar select { padding: 9px 12px; font-size: .85rem; }
  .search { position: relative; flex: 1 1 220px; min-width: 180px; }
  .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; stroke: var(--muted); fill: none; stroke-width: 2; stroke-linecap: round; }
  .search input { width: 100%; padding: 9px 12px 9px 34px; font-size: .88rem; }
  .meta-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin: 0 2px 10px; color: var(--muted); font-size: .8rem; }
  .meta-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .meta-actions .btn { padding: 7px 12px; font-size: .8rem; }

  /* table */
  .table-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow-x: auto; box-shadow: var(--shadow); }
  table { width: 100%; border-collapse: collapse; min-width: 760px; }
  th, td { text-align: left; padding: 12px 14px; font-size: .86rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { color: var(--muted); font-weight: 600; font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; background: var(--tint); }
  tr:last-child td { border-bottom: 0; }
  td.id { color: var(--muted); font-variant-numeric: tabular-nums; width: 56px; }
  td.title { font-weight: 600; }
  td.desc { color: var(--muted); max-width: 230px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td.when { color: var(--muted); white-space: nowrap; font-size: .8rem; }
  tr.clickable { cursor: pointer; transition: background .12s; }
  tr.clickable:hover td, tr.clickable:focus-visible td { background: var(--hover); }
  tr.clickable:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  tr.urgent td:first-child { box-shadow: inset 3px 0 0 var(--u5); }
  .row-needs-review { background: color-mix(in srgb, var(--err) 4%, transparent); }
  .empty { color: var(--muted); text-align: center; padding: 40px 24px; font-size: .92rem; }
  .skeleton { height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--border) 25%, var(--border-strong) 50%, var(--border) 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .cat-tag { font-size: .82rem; }

  .urg { white-space: nowrap; font-weight: 700; font-variant-numeric: tabular-nums; }
  .meter { display: inline-flex; gap: 2px; vertical-align: middle; margin-right: 8px; }
  .meter i { width: 5px; height: 14px; border-radius: 2px; background: var(--border-strong); }
  .u1 { color: var(--u1); } .u2 { color: var(--u2); } .u3 { color: var(--u3); }
  .u4 { color: var(--u4); } .u5 { color: var(--u5); }
  .u1 .meter i.on { background: var(--u1); } .u2 .meter i.on { background: var(--u2); }
  .u3 .meter i.on { background: var(--u3); } .u4 .meter i.on { background: var(--u4); }
  .u5 .meter i.on { background: var(--u5); }

  .rowbtn { padding: 5px 12px; font-size: .76rem; font-weight: 700; border-radius: 8px; border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent); background: color-mix(in srgb, var(--accent) 9%, transparent); color: var(--accent); cursor: pointer; transition: background .12s; }
  .rowbtn:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 22%, transparent); }
  .rowbtn:disabled { opacity: .5; cursor: wait; }

  .auth-hint { text-align: center; color: var(--muted); font-size: .95rem; padding: 48px 20px; border: 1px dashed var(--border-strong); border-radius: 14px; background: var(--tint); }
  .auth-hint svg { display: block; margin: 0 auto 12px; width: 34px; height: 34px; stroke: var(--accent); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* detail drawer */
  .detail-backdrop { position: fixed; inset: 0; background: rgba(3,7,18,.6); backdrop-filter: blur(3px); display: flex; justify-content: flex-end; z-index: 50; }
  .detail-backdrop[hidden] { display: none; }
  .detail-panel { position: relative; width: min(560px, 100%); height: 100%; overflow-y: auto; background: var(--card); border-left: 1px solid var(--border-strong); padding: 26px 24px 32px; box-shadow: -24px 0 60px -20px rgba(0,0,0,.5); animation: slide .22s ease-out; }
  @keyframes slide { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
  .detail-close { position: absolute; top: 12px; right: 14px; width: 34px; height: 34px; display: grid; place-items: center; background: transparent; border: 1px solid transparent; border-radius: 8px; color: var(--muted); font-size: 1.6rem; line-height: 1; cursor: pointer; }
  .detail-close:hover { color: var(--text); border-color: var(--border-strong); }
  .detail h2 { font-size: 1.15rem; line-height: 1.3; margin: 2px 0 10px; padding-right: 36px; letter-spacing: -.01em; }
  .detail .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .detail h3 { font-size: .7rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 22px 0 8px; padding-top: 16px; border-top: 1px solid var(--border); }
  .detail .kv { font-size: .85rem; display: flex; gap: 10px; margin: 5px 0; }
  .detail .kv b { color: var(--muted); font-weight: 600; min-width: 104px; }
  .detail .state { color: var(--muted); font-style: italic; font-size: .84rem; }
  .detail p.body { font-size: .9rem; color: var(--text-soft); margin: 10px 0 4px; line-height: 1.6; }
  .detail ul { list-style: none; margin: 0; padding: 0; font-size: .84rem; }
  .detail li { padding: 8px 0; border-bottom: 1px solid var(--border); }
  .detail li:last-child { border-bottom: 0; }
  .detail .act { color: var(--accent); font-weight: 700; }
  .detail .routebtn { margin-top: 22px; width: 100%; padding: 12px 14px; border-radius: 10px; border: 0; background: var(--accent); color: var(--on-accent); cursor: pointer; font: inherit; font-weight: 800; font-size: .92rem; }
  .detail .routebtn:hover:not([disabled]) { filter: brightness(1.08); }
  .detail .routebtn[disabled] { opacity: .4; cursor: not-allowed; }

  @media (max-width: 640px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    th.desc-col, td.desc, th.src-col, td.src { display: none; }
    table { min-width: 520px; }
    .brand .sep, h1 { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand logo-header">
      <img src="/static/reporta-logo-cropped.svg" alt="Reporta logo" onerror="this.remove()">
      <span class="sep"></span>
      <h1>Priority Dashboard</h1>
    </div>
    <div class="head-right">
      <span id="auth-box">
        <input id="auth-user" placeholder="admin user" autocomplete="username" aria-label="Admin username">
        <input id="auth-pass" type="password" placeholder="password" autocomplete="current-password" aria-label="Admin password">
        <button id="auth-btn">Sign in</button>
        <span id="auth-state"></span>
        <button id="auth-out" type="button">Sign out</button>
      </span>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch theme">
        <svg class="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <a class="pill-link" href="/">&larr; Submit a report</a>
    </div>
  </header>

  <section class="stats" id="stats"></section>

  <section class="toolbar" id="toolbar">
    <label class="search">
      <span class="sr-only">Search reports</span>
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="f-search" type="search" placeholder="Search title, description, location…" autocomplete="off">
    </label>
    <select id="f-category" aria-label="Filter by category">
      <option value="">All categories</option>
      <option value="roads">Roads</option>
      <option value="water">Water</option>
      <option value="waste">Waste</option>
      <option value="public_services">Public services</option>
    </select>
    <select id="f-status" aria-label="Filter by status">
      <option value="">All statuses</option>
      <option value="new">New</option>
      <option value="routed">Routed</option>
      <option value="in_progress">In progress</option>
      <option value="resolved">Resolved</option>
      <option value="closed">Closed</option>
    </select>
    <select id="f-source" aria-label="Filter by source">
      <option value="">All sources</option>
      <option value="web">Web</option>
      <option value="telegram">Telegram</option>
      <option value="api">API</option>
    </select>
    <select id="f-review" aria-label="Filter by review need">
      <option value="">All reports</option>
      <option value="1">Needs review</option>
      <option value="0">No review needed</option>
    </select>
    <select id="f-sort" aria-label="Sort reports">
      <option value="urgency">Sort: Most urgent</option>
      <option value="newest">Sort: Newest</option>
      <option value="oldest">Sort: Oldest</option>
    </select>
  </section>

  <div class="meta-row" id="meta-row">
    <span id="result-count"></span>
    <span class="meta-actions">
      <span id="updated-at"></span>
      <button class="btn" id="reload" type="button">&#8635; Refresh</button>
      <button class="btn" id="export" type="button">&#8681; Export CSV</button>
    </span>
  </div>

  <div class="table-wrap" id="report-list">
    <table>
      <thead>
        <tr>
          <th>ID</th><th>Title</th><th class="desc-col">Description</th><th>Category</th>
          <th>Urgency</th><th>Status</th><th class="src-col">Source</th><th>Reported</th><th></th>
        </tr>
      </thead>
      <tbody id="rows"><tr><td colspan="9" class="empty">Loading…</td></tr></tbody>
    </table>
  </div>
  <div id="auth-hint" class="auth-hint is-hidden">
    <svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    Admin sign-in required — public report form stays at /
  </div>
</div>

<div class="detail-backdrop" id="detail-backdrop" hidden>
  <div class="detail-panel" role="dialog" aria-modal="true" aria-label="Report detail">
    <button class="detail-close" id="detail-close" aria-label="Close detail">&times;</button>
    <div class="detail" id="detail-body"></div>
  </div>
</div>

<script>
(function () {
  var CATS = { roads: "Roads", water: "Water", waste: "Waste", public_services: "Public services", other: "Other" };
  var el = function (id) { return document.getElementById(id); };
  var allRows = [];
  var lastFocus = null;

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function toast(text, kind) { if (window.reportaToast) window.reportaToast(text, kind); }

  function parseDate(s) {
    if (!s) return null;
    var d = new Date(String(s).replace(" ", "T") + "Z");
    return isNaN(d.getTime()) ? null : d;
  }

  function ago(s) {
    var d = parseDate(s);
    if (!d) return "—";
    var sec = Math.max(0, Math.round((Date.now() - d.getTime()) / 1000));
    if (sec < 60) return "just now";
    var m = Math.round(sec / 60);
    if (m < 60) return m + " min ago";
    var h = Math.round(m / 60);
    if (h < 24) return h + " h ago";
    var days = Math.round(h / 24);
    if (days < 30) return days + " d ago";
    return d.toISOString().slice(0, 10);
  }

  function meter(u) {
    var lvl = Math.max(1, Math.min(u, 5)), bars = "";
    for (var i = 1; i <= 5; i++) bars += '<i class="' + (i <= lvl ? "on" : "") + '"></i>';
    return '<span class="meter" aria-hidden="true">' + bars + "</span>";
  }

  function skeletonRows() {
    var row = "<tr>" + new Array(10).join('<td><div class="skeleton"></div></td>') + "</tr>";
    return row + row + row;
  }

  function handle401() {
    el("stats").classList.add("is-hidden");
    el("report-list").classList.add("is-hidden");
    el("toolbar").classList.add("is-hidden");
    el("meta-row").classList.add("is-hidden");
    el("auth-hint").classList.remove("is-hidden");
    el("auth-box").classList.add("auth-prompt");
    var state = el("auth-state");
    state.textContent = "session expired — sign in";
    state.style.color = "var(--u1)";
    closeDetail();
    el("auth-user").focus();
  }

  function loadStats() {
    fetch("/api/stats").then(function (r) {
      if (r.status === 401) { handle401(); return null; }
      if (!r.ok) return null;
      return r.json();
    }).then(function (s) {
      if (!s) return;
      el("auth-box").classList.add("signed-in");
      el("auth-state").textContent = "Admin signed in";
      el("auth-state").style.color = "var(--muted)";
      var items = [
        { n: s.total, l: "Total reports", c: "var(--accent)" },
        { n: s.by_status.new || 0, l: "New", c: "var(--violet)" },
        { n: s.by_status.routed || 0, l: "Routed", c: "var(--u2)" },
        { n: s.by_status.in_progress || 0, l: "In progress", c: "var(--u3)" },
        { n: s.urgent_open, l: "Urgent open (urg ≥ 4)", c: "var(--u5)", cls: " urgent" }
      ];
      el("stats").innerHTML = items.map(function (i) {
        return '<div class="stat' + (i.cls || "") + '" style="--c:' + i.c + '"><div class="n">' + i.n + '</div><div class="l">' + i.l + "</div></div>";
      }).join("");
    });
  }

  /* ---- list: server filters, client search + sort ---- */
  function visibleRows() {
    var q = el("f-search").value.trim().toLowerCase();
    var rows = allRows.filter(function (r) {
      if (!q) return true;
      return (String(r.id) + " " + (r.title || "") + " " + (r.description || "") + " " +
              (r.location || "") + " " + (r.reporter || "")).toLowerCase().indexOf(q) !== -1;
    });
    var sort = el("f-sort").value;
    if (sort === "newest" || sort === "oldest") {
      rows = rows.slice().sort(function (a, b) {
        var da = parseDate(a.created_at), db = parseDate(b.created_at);
        var d = (db ? db.getTime() : 0) - (da ? da.getTime() : 0);
        return sort === "newest" ? d || (b.id - a.id) : -d || (a.id - b.id);
      });
    }
    return rows;
  }

  function renderRows() {
    var rows = visibleRows();
    var total = allRows.length;
    el("result-count").textContent = rows.length === total
      ? "Showing " + total + " report" + (total === 1 ? "" : "s")
      : "Showing " + rows.length + " of " + total + " reports";

    if (!rows.length) {
      el("rows").innerHTML = '<tr><td colspan="9" class="empty">' +
        (total ? "No reports match your search." : "No reports match these filters.") + "</td></tr>";
      return;
    }
    el("rows").innerHTML = rows.map(function (r) {
      var lvl = Math.min(r.urgency, 5);
      var urgCls = "u" + lvl;
      var isUrgent = r.urgency >= 4 && r.status !== "resolved" && r.status !== "closed";
      var rowCls = ["clickable"];
      if (isUrgent) rowCls.push("urgent");
      if (r.needs_review) rowCls.push("row-needs-review");
      return '<tr class="' + rowCls.join(" ") + '" data-id="' + r.id + '" tabindex="0" aria-label="Open report ' + r.id + '">' +
        '<td class="id">#' + r.id + "</td>" +
        '<td class="title">' + esc(r.title) + (r.needs_review ? ' <span class="badge rev">review</span>' : "") + "</td>" +
        '<td class="desc">' + esc((r.description || "").slice(0, 80)) + "</td>" +
        '<td class="cat-tag">' + (CATS[r.category] || esc(r.category)) + "</td>" +
        '<td class="urg ' + urgCls + '">' + meter(r.urgency) + r.urgency + "/5</td>" +
        '<td><span class="badge st-' + esc(r.status) + '">' + esc(r.status).replace("_", " ") + "</span></td>" +
        '<td class="cat-tag src">' + esc(r.source) + "</td>" +
        '<td class="when" title="' + esc(r.created_at) + ' UTC">' + ago(r.created_at) + "</td>" +
        "<td>" + (r.status === "new" ? '<button class="rowbtn" data-id="' + r.id + '">Route</button>' : "") + "</td>" +
        "</tr>";
    }).join("");
  }

  function loadRows() {
    var p = new URLSearchParams();
    var cat = el("f-category").value, st = el("f-status").value,
        src = el("f-source").value, rev = el("f-review").value;
    if (cat) p.set("category", cat);
    if (st) p.set("status", st);
    if (src) p.set("source", src);
    if (rev !== "") p.set("needs_review", rev);

    el("rows").innerHTML = skeletonRows();

    fetch("/api/reports?" + p.toString()).then(function (r) {
      if (r.status === 401) { handle401(); return null; }
      if (!r.ok) return null;
      return r.json();
    }).then(function (rows) {
      if (!rows) return;
      allRows = rows;
      el("updated-at").textContent = "Updated " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      renderRows();
    });
  }

  /* ---- CSV export of the rows currently shown ---- */
  function csvCell(v) {
    var s = String(v == null ? "" : v);
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;   // neutralise spreadsheet formulas
    return '"' + s.replace(/"/g, '""') + '"';
  }

  function exportCsv() {
    var rows = visibleRows();
    if (!rows.length) { toast("Nothing to export", "err"); return; }
    var cols = ["id", "title", "description", "category", "urgency", "status", "source",
                "reporter", "location", "needs_review", "created_at"];
    var lines = [cols.join(",")].concat(rows.map(function (r) {
      return cols.map(function (c) { return csvCell(r[c]); }).join(",");
    }));
    var blob = new Blob(["\ufeff" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "reports-" + new Date().toISOString().slice(0, 10) + ".csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    toast("Exported " + rows.length + " report" + (rows.length === 1 ? "" : "s"), "ok");
  }

  /* ---- detail drawer ---- */
  var backdrop = el("detail-backdrop");
  var detailBody = el("detail-body");

  function closeDetail() {
    var wasOpen = !backdrop.hidden;
    backdrop.hidden = true;
    detailBody.innerHTML = "";
    if (wasOpen && lastFocus && document.contains(lastFocus)) { lastFocus.focus(); }
  }

  function openDetail(id) {
    if (backdrop.hidden) lastFocus = document.activeElement;
    detailBody.innerHTML = '<p class="state">Loading…</p>';
    backdrop.hidden = false;
    el("detail-close").focus();
    fetch("/api/reports/" + id + "/detail").then(function (r) {
      if (r.status === 401) { handle401(); return null; }
      if (!r.ok) throw new Error("detail " + r.status);
      return r.json();
    }).then(function (d) {
      if (d) renderDetail(d);
    }).catch(function () {
      detailBody.innerHTML = '<p class="state">Could not load this report.</p>';
      backdrop.hidden = false;
    });
  }

  function renderDetail(d) {
    var rep = d.report, an = d.analysis, hist = d.routing_history,
        opts = d.next_options, atts = d.attachments;
    var h = [];
    h.push("<h2>#" + rep.id + " " + esc(rep.title) + "</h2>");
    h.push('<div class="chips"><span class="badge st-' + esc(rep.status) + '">' + esc(rep.status).replace("_", " ") + "</span>" +
      (an.needs_review ? '<span class="badge rev" style="margin-left:0">needs review</span>' : "") + "</div>");
    h.push('<div class="kv"><b>Status</b><span>' + esc(rep.status) + "</span></div>");
    h.push('<div class="kv"><b>Category</b><span>' + (CATS[rep.category] || esc(rep.category)) + "</span></div>");
    h.push('<div class="kv"><b>Source</b><span>' + esc(rep.source) + "</span></div>");
    h.push('<div class="kv"><b>Reporter</b><span>' + esc(rep.reporter || "—") + "</span></div>");
    h.push('<div class="kv"><b>Location</b><span>' + esc(rep.location || "—") + "</span></div>");
    h.push('<div class="kv"><b>Reported</b><span>' + esc(rep.created_at || "—") + " UTC (" + ago(rep.created_at) + ")</span></div>");
    h.push('<p class="body">' + esc(rep.description) + "</p>");

    h.push("<h3>Analysis</h3>");
    if (an.state === "not classified (pre-T4 report)") {
      h.push('<div class="state">not classified (pre-T4 report)</div>');
    } else {
      h.push('<div class="kv"><b>State</b><span>classified</span></div>');
      h.push('<div class="kv"><b>Confidence</b><span>' + esc(an.confidence) + "</span></div>");
      h.push('<div class="kv"><b>Urgency</b><span class="urg u' + Math.max(1, Math.min(an.urgency, 5)) + '">' + meter(an.urgency) + esc(an.urgency) + "/5</span></div>");
      h.push('<div class="kv"><b>Needs review</b><span>' + (an.needs_review ? "yes" : "no") + "</span></div>");
      h.push('<div class="kv"><b>Reason</b><span>' + esc(an.reason) + "</span></div>");
    }

    h.push("<h3>Attachments</h3>");
    if (!atts.length) {
      h.push('<div class="state">no attachment</div>');
    } else {
      h.push("<ul>" + atts.map(function (a) {
        return '<li><span class="act">' + esc(a.media_type) + "</span> " + esc(a.file_ref) +
          ' <span class="state">' + esc(a.created_at) + "</span></li>";
      }).join("") + "</ul>");
    }

    h.push("<h3>Routing history</h3>");
    if (!hist.length) {
      h.push('<div class="state">no routing history yet</div>');
    } else {
      h.push("<ul>" + hist.map(function (ev) {
        var txt;
        if (ev.action === "classified" && ev.detail && typeof ev.detail === "object") {
          txt = esc(ev.detail.suggested_category || ev.detail.mode || JSON.stringify(ev.detail));
        } else {
          txt = esc(ev.detail);
        }
        return '<li><span class="act">' + esc(ev.action) + "</span> " + txt +
          ' <span class="state">' + esc(ev.created_at) + "</span></li>";
      }).join("") + "</ul>");
    }

    h.push("<h3>Next routing options</h3>");
    if (!opts.length) {
      h.push('<div class="state">no active authority for category</div>');
    } else {
      h.push("<ul>" + opts.map(function (o) {
        return "<li>" + esc(o.name) +
          ' <span class="state">priority ' + esc(o.priority) + "</span></li>";
      }).join("") + "</ul>");
    }

    var canRoute = rep.status === "new" && opts.length > 0;
    h.push('<button class="routebtn" id="detail-route" data-id="' + rep.id + '"' +
      (canRoute ? "" : " disabled") + ">Route to authority</button>");
    detailBody.innerHTML = h.join("");

    var rbtn = el("detail-route");
    if (rbtn && canRoute) {
      rbtn.addEventListener("click", function () {
        rbtn.disabled = true;
        fetch("/api/route/" + rbtn.dataset.id, { method: "GET" })
          .then(function (r) {
            if (r.status === 401) { handle401(); return null; }
            if (!r.ok) { toast("Could not route report #" + rep.id, "err"); rbtn.disabled = false; return null; }
            return r.json();
          })
          .then(function (b) {
            if (!b) return;
            toast("Report #" + rep.id + " routed", "ok");
            loadRows(); loadStats(); openDetail(rep.id);
          });
      });
    }
  }

  el("detail-close").addEventListener("click", closeDetail);
  backdrop.addEventListener("click", function (e) { if (e.target === backdrop) closeDetail(); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !backdrop.hidden) { closeDetail(); return; }
    // keep keyboard focus inside the open drawer
    if (e.key === "Tab" && !backdrop.hidden) {
      var f = backdrop.querySelectorAll("button:not([disabled])");
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  el("rows").addEventListener("click", function (e) {
    var btn = e.target.closest(".rowbtn");
    if (btn) {
      e.stopPropagation();
      btn.disabled = true;
      fetch("/api/route/" + btn.dataset.id, { method: "GET" })
        .then(function (r) {
          if (r.status === 401) { handle401(); return null; }
          if (!r.ok) { toast("Could not route report #" + btn.dataset.id, "err"); btn.disabled = false; return null; }
          return r.json();
        })
        .then(function (b) {
          if (!b) return;
          toast("Report #" + btn.dataset.id + " routed", "ok");
          loadRows(); loadStats();
        });
      return;
    }
    var tr = e.target.closest("tr[data-id]");
    if (tr) openDetail(tr.dataset.id);
  });
  el("rows").addEventListener("keydown", function (e) {
    if ((e.key === "Enter" || e.key === " ") && e.target.matches("tr[data-id]")) {
      e.preventDefault();
      openDetail(e.target.dataset.id);
    }
  });

  ["f-category", "f-status", "f-source", "f-review"].forEach(function (id) {
    el(id).addEventListener("change", loadRows);
  });
  el("f-search").addEventListener("input", renderRows);
  el("f-sort").addEventListener("change", renderRows);
  el("reload").addEventListener("click", function () { loadRows(); loadStats(); });
  el("export").addEventListener("click", exportCsv);

  // Admin sign-in: session cookie unlocks detail view + route buttons.
  var authBtn = el("auth-btn");
  authBtn.addEventListener("click", function () {
    fetch("/api/admin/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify({
        username: el("auth-user").value,
        password: el("auth-pass").value,
      }),
    }).then(function (r) {
      if (r.ok) {
        location.reload();
      } else if (r.status === 503) {
        el("auth-state").textContent = "admin auth not configured";
        el("auth-state").style.color = "var(--err)";
      } else {
        el("auth-state").textContent = "invalid credentials";
        el("auth-state").style.color = "var(--err)";
      }
    }).catch(function () {
      el("auth-state").textContent = "sign-in failed";
      el("auth-state").style.color = "var(--err)";
    });
  });
  el("auth-out").addEventListener("click", function () {
    fetch("/api/admin/logout", { method: "POST", credentials: "same-origin" })
      .finally(function () { location.reload(); });
  });
  el("auth-pass").addEventListener("keydown", function (e) {
    if (e.key === "Enter") authBtn.click();
  });

  loadStats();
  loadRows();
})();
</script>
</body>
</html>
