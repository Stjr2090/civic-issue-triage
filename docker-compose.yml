services:
  app:
    build: .
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      PORT: "${PORT:-8000}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      GROQ_MODEL: "${GROQ_MODEL:-}"
      WHISPER_MODEL: "${WHISPER_MODEL:-}"
      TRANSCRIPT_LOGPROB_FLOOR: "${TRANSCRIPT_LOGPROB_FLOOR:-}"
      TRANSCRIPT_NO_SPEECH_CEIL: "${TRANSCRIPT_NO_SPEECH_CEIL:-}"
      TRANSCRIPT_COMPRESSION_RANGE: "${TRANSCRIPT_COMPRESSION_RANGE:-}"
      WHATSAPP_VERIFY_TOKEN: "${WHATSAPP_VERIFY_TOKEN:-}"
      WHATSAPP_APP_SECRET: "${WHATSAPP_APP_SECRET:-}"
      WHATSAPP_TOKEN: "${WHATSAPP_TOKEN:-}"
      WHATSAPP_PHONE_NUMBER_ID: "${WHATSAPP_PHONE_NUMBER_ID:-}"
    volumes:
      - civic_db:/data
    restart: unless-stopped

volumes:
  civic_db:
