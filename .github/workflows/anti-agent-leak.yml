name: anti-agent-leak

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan diff for agent artifacts
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          if [ -z "$(echo "$base" | tr -d 0)" ]; then
            echo "no diff to scan"
            exit 0
          fi
          git diff "$base" "$head" --unified=0 > /tmp/pr.diff
          hits=0
          scan() {
            if grep -qiE "$2" /tmp/pr.diff; then
              echo "::error::$1"
              hits=1
            fi
          }
          scan "reasoning block or thinking chatter in diff" '^[+].*(-# |reasoning[[:space:]]*:|thinking[[:space:]]*:)'
          scan "co-authored-by trailer naming an agent or bot" '^[+].*co-authored-by:.*([Bb]ot|[Aa]gent|wajo)'
          scan "generated-with marker in diff" '^[+].*(generated with|co-written with|generated by)'
          scan "agent tool-call chatter in diff" '^[+].*(arg_key|arg_value|<\|TOOL_CALL\|>)'
          exit $hits
